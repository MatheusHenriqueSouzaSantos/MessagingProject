services:
  producer:
    container_name: producer
    build: ./ProducerMessagingProject
    ports: 
      - "8080:8080"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/messaging_project
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
  consumer:
    container_name: consumer
    build: ./ConsumerMessagingProject
    ports: 
      - "8081:8080"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      MAIL_HOST:  # your mail host at mailtrap
      MAIL_PORT:  # your mail port at mailtrap
      MAIL_USERNAME: # your mail username at mailtrap
      MAIL_PASSWORD: # your mail password at mailtrap
    depends_on: 
      rabbitmq:
        condition: service_healthy
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: messaging_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: 
      - "5433:5432"
    healthcheck: 
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASSWORD: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
